<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="../js/gc-fit.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GC Tech RCM - Daily Activity</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="stylesheet" href="../css/rcm-fleet-planner.css">
  <link rel="stylesheet" href="../css/gc-daily-activity.css">
  <link rel="stylesheet" href="../css/gc-whatsapp.css" id="wa-styles">
  <link rel="stylesheet" href="../css/gc-rcm-shell.css">
</head>
<body class="fleet-body-wrapper">

  <header class="topbar">
    <div class="topbar-title">DAILY ACTIVITY — VEHICLE ACTIVITY REPORT</div>
    <div class="topbar-actions da-actions">
      <button type="button" class="da-tool wa" title="Send pick-up reminders by WhatsApp (via 3CX)" onclick="daWhatsAppReminders()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
        WhatsApp reminders</button>
      <button type="button" class="da-tool" title="Print" onclick="daPrint()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print</button>
      <button type="button" class="da-tool xls" title="Export to Excel (CSV)" onclick="daExportAll()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13l5 5M14 13l-5 5"/></svg>
        Excel</button>
      <button type="button" class="da-tool pdf" title="Save as PDF" onclick="daPdf()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 17v-4h1.5a1.5 1.5 0 0 1 0 3H8"/></svg>
        PDF</button>
      <button type="button" class="da-tool" title="Full screen" onclick="daToggleFullscreen()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <label class="da-switch" title="Keep the column headers visible while scrolling">
        <input type="checkbox" id="da-fixed" onchange="daView()"><span></span> Fixed Headers
      </label>
    </div>
  </header>

  <!-- FILTROS (mesmos do Vehicle Activity Report do RCM) -->
  <div class="da-filterbar">
    <div class="da-filter-row">
      <label>Pickup<select id="da-branch" onchange="daView()"></select></label>
      <label>Date
        <span class="da-dt">
          <input type="date" id="da-from-date" onchange="daView()">
          <select id="da-from-h" onchange="daView()"></select><b>:</b><select id="da-from-m" onchange="daView()"></select>
        </span>
      </label>
      <label>To
        <span class="da-dt">
          <input type="date" id="da-to-date" onchange="daView()">
          <select id="da-to-h" onchange="daView()"></select><b>:</b><select id="da-to-m" onchange="daView()"></select>
        </span>
      </label>
      <label>Category Type
        <select id="da-section" onchange="daFillCategories(); daView()">
          <option value="ALL">All Category Type</option>
          <option value="Passenger">Passenger</option>
          <option value="Commercial">Commercial</option>
        </select>
      </label>
      <label>Category<select id="da-category" class="wide" onchange="daView()"></select></label>
      <button type="button" class="btn btn-submit da-view-btn" onclick="daView()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        View</button>
    </div>
    <div class="da-filter-row">
      <label>Brand
        <select id="da-brand" onchange="daView()">
          <option value="ALL">All Brands</option>
          <option value="GC TECH">GC Tech Rentals</option>
        </select>
      </label>
      <label>Activity
        <select id="da-activity" onchange="daView()">
          <option value="current">Current Activity</option>
          <option value="all">Include Cancelled</option>
        </select>
      </label>
      <label>List
        <select id="da-list" onchange="daView()">
          <option value="both">Pickup and Dropoff List</option>
          <option value="pickup">Pickup List</option>
          <option value="dropoff">Drop off List</option>
        </select>
      </label>
      <label>Balance
        <select id="da-balance" onchange="daView()">
          <option value="include">Include Balance</option>
          <option value="exclude">Exclude Balance</option>
        </select>
      </label>
      <label>Notes
        <select id="da-notes" onchange="daView()">
          <option value="include">Include Notes</option>
          <option value="exclude">Exclude Notes</option>
        </select>
      </label>
      <label>Non-revenue
        <select id="da-nonrev" onchange="daView()">
          <option value="include">Include Non-revenue &amp; Maint.</option>
          <option value="exclude-both">Exclude Non-revenue &amp; Maint.</option>
          <option value="exclude-nonrev">Exclude Non-revenue</option>
          <option value="exclude-maint">Exclude Maint.</option>
        </select>
      </label>
      <label class="da-check"><input type="checkbox" id="da-lite" onchange="daView()"> Lite version</label>
    </div>
  </div>

  <!-- DIA ANTERIOR / PRÓXIMO -->
  <div class="da-daynav">
    <button type="button" class="da-nav-btn" onclick="daShiftDay(-1)">◀ Prev Day</button>
    <div class="da-day">
      <strong id="da-day-title">Today</strong>
      <span id="da-day-sub"></span>
    </div>
    <div class="da-nav-right">
      <button type="button" class="da-nav-btn ghost" onclick="daToday()">Today</button>
      <button type="button" class="da-nav-btn" onclick="daShiftDay(1)">Next Day ▶</button>
    </div>
  </div>

  <div class="da-results" id="da-results"></div>

  <script src="../js/gc-ui.js"></script>
  <script src="../js/gc-dates.js"></script>
  <script src="../js/gc-rcm-shell.js"></script>
  <script src="../js/gc-fleet-data.js"></script>
  <script src="../js/gc-fees-data.js"></script>
  <script src="../js/gc-bonds.js"></script>
  <script src="../js/gc-whatsapp.js"></script>
  <script src="../js/gc-daily-activity.js"></script>
  <script src="../js/gc-anna.js"></script>
  <script src="../js/gc-demo.js"></script>
</body>
</html>
