<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="../js/gc-fit.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GC Tech RCM - Activity Log</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/gc-logo.svg">
  <link rel="stylesheet" href="../css/rcm-fleet-planner.css">
  <link rel="stylesheet" href="../css/gc-daily-activity.css">
  <link rel="stylesheet" href="../css/gc-rcm-shell.css">
  <style>
    .lg-filterbar input[type="text"] { padding: 5px 8px; border-radius: 4px; border: 1px solid #1e40af; background: #fff; color: #0f172a; font-size: 12px; width: 240px; }
    .lg-reset { background: transparent; border: 1px solid #93c5fd; color: #e0f2fe; border-radius: 5px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .lg-reset:hover { background: rgba(255,255,255,.08); }
    .lg-summary { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0 12px; }
    .lg-kpi { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; min-width: 160px; }
    .lg-kpi span { display: block; font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 600; letter-spacing: .4px; }
    .lg-kpi strong { display: block; font-size: 18px; color: #fff; margin-top: 3px; }
    .lg-kpi small { display: block; font-size: 12px; color: #94a3b8; margin-top: 1px; }
    .lg-results .log-table-wrap { max-height: none; overflow: visible; }
    .lg-results .log-table th { top: 0; }
    .lg-results .log-table td.details { max-width: 420px; }
    .lg-ref-btn { background: none; border: none; padding: 0; color: #60a5fa; font: inherit; font-weight: 700; cursor: pointer; }
    .lg-ref-btn:hover { text-decoration: underline; }
    .lg-ref { font-weight: 700; color: #e2e8f0; }
    .lg-plate { display: inline-block; background: #fde047; color: #000; font-weight: 800; font-size: 11px; padding: 1px 6px; border-radius: 3px; letter-spacing: .4px; }
    .lg-more { display: block; margin: 14px auto 0; }
    .lg-scope { font-size: 13px; color: #cbd5e1; margin-top: 4px; }
    .lg-scope strong { color: #fff; }
    @media print {
      .sidebar, .rcm-sidebar, .topbar-actions, .lg-filterbar, .lg-more { display: none !important; }
      body, .lg-results { background: #fff !important; color: #000 !important; }
      .log-table td { background: #fff !important; color: #000 !important; border-bottom: 1px solid #ccc !important; }
      .log-table th { background: #1e4f8a !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .lg-kpi { border-color: #ccc; background: #fff; }
      .lg-kpi strong { color: #000; }
    }
  </style>
</head>
<body class="fleet-body-wrapper">

  <header class="topbar">
    <div class="topbar-title">ACTIVITY LOG — WHO CHANGED WHAT</div>
    <div class="topbar-actions da-actions">
      <button type="button" class="da-tool" title="Print" onclick="window.print()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print</button>
      <button type="button" class="da-tool xls" title="Export to Excel (CSV)" onclick="lgExport()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13l5 5M14 13l-5 5"/></svg>
        Excel</button>
    </div>
  </header>

  <div class="da-filterbar lg-filterbar">
    <div class="da-filter-row">
      <label>Search<input type="text" id="lg-search" placeholder="Res #, rego, customer or details..." oninput="lgView()"></label>
      <label>Operator<select id="lg-operator" onchange="lgView()"></select></label>
      <label>Action<select id="lg-action" onchange="lgView()"></select></label>
      <label>From<input type="date" id="lg-from" onchange="lgView()"></label>
      <label>To<input type="date" id="lg-to" onchange="lgView()"></label>
      <label>Period
        <select id="lg-period" onchange="lgSetPeriod(this.value)">
          <option value="today">Today</option>
          <option value="7" selected>Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="all">All dates</option>
          <option value="custom" hidden>Custom</option>
        </select>
      </label>
      <label class="da-check"><input type="checkbox" id="lg-staff" onchange="lgView()"> Staff changes only</label>
      <button type="button" class="lg-reset" onclick="lgReset()">Reset</button>
    </div>
  </div>

  <div class="da-results lg-results" id="lg-results"></div>

  <script src="../js/gc-ui.js"></script>
  <script src="../js/gc-dates.js"></script>
  <script src="../js/gc-rcm-shell.js"></script>
  <script src="../js/gc-fleet-data.js"></script>
  <script src="../js/gc-activity-log.js"></script>
  <script src="../js/gc-demo.js"></script>
</body>
</html>
